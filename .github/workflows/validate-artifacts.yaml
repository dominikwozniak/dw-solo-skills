name: Validate artifacts

on:
  pull_request:
    paths:
      - scripts/tests/**
      # Filter on the canon, never the plugin symlinks: editing scripts/runtime/<s>.sh
      # leaves plugins/dw-solo/scripts/<s>.sh (the link target string) untouched,
      # so a plugins/** filter never fires for it and the self-tests would be skipped.
      - scripts/runtime/**
      # hooks-in-sync + the two hook self-tests read templates/hooks/ directly.
      - templates/**
      # this repo's own installed copies, which hooks-in-sync pins to the canon.
      - .claude/hooks/**
      # the dogfood pass reads these records — without the folder here, a commit that only adds
      # or edits one matches no filter and the check that exists for it never runs.
      - docs/decisions/**
      # pass 3 measures these. A commit that appends words to a SKILL.md is the exact shape the
      # ratchet exists to catch, and without skills/** here it matches no filter — CI goes green
      # with the check never invoked, while validate-docs.yaml (which does list skills/**) runs
      # and ticks. The baseline and the checker are here for the same reason.
      - skills/**
      - scripts/check-skill-corpus.mjs
      - scripts/skill-corpus.baseline.json
      # pass 2 caps this folder, and a commit that only appends an entry is the exact shape the cap
      # exists to catch — without it here, that commit matched no filter and the cap never ran.
      - .ai/backlog/**
      - scripts/validate-artifacts.sh
      - .github/workflows/validate-artifacts.yaml
  push:
    branches: [main]
    paths:
      - scripts/tests/**
      - scripts/runtime/**
      - templates/**
      - .claude/hooks/**
      - docs/decisions/**
      - skills/**
      - scripts/check-skill-corpus.mjs
      - scripts/skill-corpus.baseline.json
      - .ai/backlog/**
      - scripts/validate-artifacts.sh
      - .github/workflows/validate-artifacts.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Validate artifacts
        shell: bash
        run: ./scripts/validate-artifacts.sh

name: Validate version bumps

# Deliberately NO `paths:` filter, unlike every other validate-* workflow here. This check's whole
# subject is which paths changed, so filtering it by path is the same blind spot one level up: the
# commit shape it exists to catch is a payload edit with no manifest touched, which is precisely what
# a `**/plugin.json` filter skips. It is bash, git and jq over a shallow-ish clone — cheap enough that
# running it on every PR costs less than reasoning about which filter would be complete.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate version bumps
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 — every other validate-* job uses 1 because it reads only the checked-out
      # tree. This one needs the base branch's tip AND a merge base with it, neither of which exists
      # in a depth-1 clone.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # No pnpm/setup step, matching validate-artifacts.yaml and validate-docs.yaml: the checker is
      # bash over git and jq, both present on the runner, and it has no dev-tree dependency.
      #
      # On a push to main the base resolves to origin/main, which IS the checked-out commit — the
      # merge base is HEAD, the diff is empty, and the job exits 0 having asserted nothing. That is
      # intended: the check only ever has an opinion about a branch that is ahead of its base.
      - name: Fetch the base branch
        shell: bash
        run: git fetch --no-tags origin "${{ github.base_ref || github.event.repository.default_branch }}"

      - name: Validate version bumps
        shell: bash
        run: ./scripts/validate-versions.sh --base "origin/${{ github.base_ref || github.event.repository.default_branch }}"

name: Routing evals

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routing:
    name: Routing evals
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # pnpm, Node and `pnpm install` in one step, all three read from package.json#devEngines —
      # `packageManager` for pnpm, `runtime` for Node. Inputs would only restate the file — `cache`
      # included: measured on #28 over a nine-entry tree and reverted, because a hit was ~1.2s
      # slower than no cache. The action installs the runtime before it restores, so Node is 45MB of
      # store the cache carries and never reuses. Don't re-add it without re-measuring.
      #
      # The install is not latency this eval could skip, though it has no dependencies of its own:
      # pnpm 11 runs a deps-status check before any script and installs when node_modules is stale,
      # so `pnpm eval:routing` on a bare runner installs anyway. `install: false` would only move
      # the same work inside this step and hide it.
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
      - run: pnpm eval:routing

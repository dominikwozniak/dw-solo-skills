# agnix lint config — dw-solo-skills is a Claude Code skills marketplace.
# Docs: https://agent-sh.github.io/agnix/docs/configuration
target = "ClaudeCode"
severity = "Warning"

exclude = [
    "node_modules/**",
    ".git/**",
    # Cloned third-party inspiration repos — untracked working material, never
    # part of this marketplace. Also the reason `agnix .` OOMed locally.
    ".inspirations/**",
    # Local agent state (gitignored) — not part of the marketplace surface,
    # so agnix doesn't lint the local drops.
    ".claude/**",
    # Template payloads — inert files copied verbatim INTO a target project
    # (settings.json / hooks / AGENTS.md, plus the artifact shapes under
    # skills/*/references/). They reference `.claude/` paths, `.ai/` dirs and hook
    # scripts that only exist once dropped, so they're not validatable in place.
    # NOTE: an exclude only applies to the project walk — agnix given an explicit
    # path lints it regardless, which is why .husky/pre-commit filters templates/
    # out of what it hands over.
    "templates/**",
    "skills/*/references/templates/**",
    # Behaviour-eval fixtures — throwaway repos the runner copies into a mkdtemp and hands to
    # `claude -p`. Their AGENTS.md files are deliberately minimal props, sized to the one promise
    # the case asserts; linting them as if they were real projects reports on a stage set.
    "evals/fixtures/**",
    # Routed topic docs. agnix classifies anything under a directory named `agents`
    # as an agent DEFINITION and fails it for having no YAML frontmatter — but these
    # are prose, reached on demand through the root's Task Router, and frontmatter on
    # them would be metadata invented purely to satisfy the name collision. The root
    # AGENTS.md itself is still linted, and `pnpm validate:docs` is what actually
    # holds this directory to its contract (every file routed to, every path real).
    "docs/agents/**",
]

[rules]
skills = true
hooks = true
plugins = true
mcp = true
frontmatter_validation = true
import_references = true
